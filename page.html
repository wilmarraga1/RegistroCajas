<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form with Bootstrap</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.12.15/dist/sweetalert2.all.min.js"></script>
  <style>
    .form-container {
      max-width: 500px;
      margin: auto;
      margin-top: 5px;
      margin-bottom: 5px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      background-color: #fff;
    }

    .imagen {
      width: 100px;
      border-radius: 50%;
      border: 3px solid #007BFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      margin-top: 10px;
      transform: scale(1.1);
      transition: transform 0.3s ease;
      filter: grayscale(50%) brightness(1.2);
      display: flex;            /* activa flexbox */
  align-items: center;      /* centra verticalmente */
  gap: 20px;  
    }
    .imagenTexto{
      display: flex;            /* activa flexbox */
      align-items: center;      /* centra verticalmente */
      gap: 10px;  
    }

    /* Responsivo para pantallas pequeñas (móviles) */
    @media (max-width: 480px) {
      body {
        padding: 0;
        max-width: 100%;
        height: auto;
      }
     
      form {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
      }
      .imagenTexto{
        display: flex;
        justify-content: center; /* horizontal */
        align-items: center;     /* vertical */

      }
      h4 {
        display: none;
      }
      
      input[type="text"],
      input[type="datetime-local"],
      textarea {
        font-size: 12px;
        padding: 8px;
      }
      
      .btn {
        font-size: 12px;
        padding: 8px;
      }
      
      a {
        font-size: 12px;
      }
    }
  </style>
</head>

<body class="bg-light">
  <div class="container">
    <div class="form-container">
      <div class="imagenTexto">
        <h4 class="text-center mb-4">Form Submission to Google Sheet</h4>
        <img class="imagen" src="image/cartonextress.png" alt="imagen de carton">
      </div>
      <form id="submit-to-google-sheet">
        <div class="form-group">
          <label for="name">Name:</label>
          <input class="form-control" type="text" name="name" id="name" placeholder="Name" required />
        </div>
        <div class="form-group">
          <label for="email">Fecha:</label>
          <input class="form-control" type="datetime-local" name="datetime" id="datetime" placeholder="Fecha"
            required />
        </div>
        <div class="form-group">
          <label for="slip">Referencia:</label>
          <input class="form-control" type="number" name="referencia" id="referencia" placeholder="Referencia"
            required />
        </div>

        <div class="form-group">
          <label for="loc">Estado:</label>
          <select class="form-control" name="estado" id="estado" required>
            <option value="" disabled selected hidden>Evalue...</option>
            <option value="Conforme">Conforme</option>
            <option value="NoConforme">No Conforme</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loc">Message:</label>
          <textarea class="form-control" name="message" id="message" placeholder="Message" required></textarea>

          <div class="form-group mt-2">
            <label for="media" class="form-check-label">Upload profile picture :</label>
            <input class="form-control-file" type="file" name="media" id="media" />
          </div>

          <div class="form-group form-check mt-2">
            <input class="form-check-input" type="checkbox" id="age" />
            <label class="form-check-label" for="age">Check if you are over 18 years old</label>
          </div>

          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="ex" required />
            <label class="form-check-label" for="ex">By checking this box I certify that I am agree with the data
              terms and policies.
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            Submit
          </button>
      </form>
    </div>
    <a href="./sheet_data.html">Datos Guardados</a>
  </div>


  <script>
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyiUUl_PE8n84XnfO2pRQvnPnPHFXBBNwPS7qP4ouzd8pmW7_vL96Su7UXMtgfYmTSA/exec";
    const form = document.forms["submit-to-google-sheet"];
    const fileInput = document.getElementById("media");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      var ex = document.getElementById("ex").checked;
      var age = document.getElementById("age").checked;

      if (age) {
        formData.append("age", "Yes");
      } else {
        formData.append("age", "No");
      }

      if (ex) {
        formData.append("ex", "Yes");
      } else {
        formData.append("ex", "No");
      }

      // Handle the file upload
      const fileInput = document.getElementById("media");
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();

        // Size validation here, only less than 2MB allowed
        if (file.size > 1024 * 1024 * 2) {
          swal("Error", "Archivo debe ser menor 2MB.", "error");
          return;
        }

        reader.onload = async function () {
          formData.append("media", reader.result.split(",")[1]); // Append base64 data
          await submitForm(formData);
        };

        reader.readAsDataURL(file);
      } else {
        // No file uploaded
        await submitForm(formData);
      }
    });

    async function submitForm(formData) {
      // Get the submit button and change its text to "Loading..."
      const submitButton = document.querySelector("button[type='submit']");
      submitButton.disabled = true;
      submitButton.innerText = "Loading...";

      // Submit the form data to the Google Sheet
      fetch(scriptURL, { method: "POST", body: formData })
        .then((response) => {
          swal("Bien", "Tu imagen se subido correctamente.", "success");
          form.reset();
        })
        .catch((error) => {
          swal("Error", "Intente de nuevo .....!", "error");
        })
        .finally(() => {
          // Reset the submit button back to "Submit"
          submitButton.disabled = false;
          submitButton.innerText = "Submit";
        });
    }

  </script>
</body>

</html>
